# Test only (not for the demo video): a worrying day.
# Same ETRI clips, rearranged so every routine check fires:
#   - no eating clip at all -> breakfast, lunch and dinner are all missed
#   - long stretches without motion -> inactivity alerts
#   - includes the bathroom clip (etri_10) to see how the VLM describes it

title: "A worrying day at Mom's"
report_at: "20:00"
footage_credit: "Footage: ETRI-Activity3D sample videos (ETRI). Test run only."

routine:
  name: Mom
  awake_from: "07:00"
  awake_to: "22:00"
  inactivity_alert_minutes: 180
  meals:
    - {name: breakfast, from: "07:00", to: "09:00"}
    - {name: lunch,     from: "11:30", to: "13:30"}
    - {name: dinner,    from: "17:30", to: "19:30"}

segments:
  - {type: idle,  from: "07:00", to: "10:30", note: "No motion detected. VLM idle."}
  - {type: video, clock: "10:30", span_minutes: 20, file: samples/etri/etri_29.mp4, label: "Living room"}
  - {type: video, clock: "10:50", span_minutes: 10, file: samples/etri/etri_10.mp4, label: "Bathroom"}
  - {type: idle,  from: "11:00", to: "15:00", note: "No motion detected. VLM idle."}
  - {type: video, clock: "15:00", span_minutes: 30, file: samples/etri/etri_24.mp4, label: "Living room"}
  - {type: idle,  from: "15:30", to: "20:00", note: "No motion detected. VLM idle."}
